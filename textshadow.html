<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>textshadow</title>
</head>
<style>
    h3
    {
        margin: 10px;
        font-size: 20px;
    }

    .a
    {
        text-shadow:  red -5px -10px 5px;       
    }


    .b
    {
        text-shadow:  green -0.5em -0.5em 0.2em;           
    }

    .c
    {
        text-shadow: #00000066 5px 4px 3px;
    }




</style>
<body>
<h3 class="a">成功不是終點，失敗也不是末日；真正重要的是勇氣。</h3>
<br>
<h3 class="b">如果你想要走得快，那就獨自前行；如果你想要走得遠，那就與人同行。</h3>
<br>
<h3 class="c">你不能改變風的方向，但可以調整帆的角度。</h3>
<br>
</body>
</html>
