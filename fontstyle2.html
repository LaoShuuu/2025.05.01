<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fontstyle2</title>
</head>
<style>
    h3{margin: 5px;color: rgb(20, 26, 78);}

    .a
    {
        text-decoration-line: underline;
        text-decoration-style:solid ;
        text-decoration-color:red ;
        text-decoration-thickness: 3px;         

    }


    .b
    {
        text-decoration-line: underline;
        text-decoration-style:wavy ;
        text-decoration-color:rgb(19, 150, 14) ;
        text-decoration-thickness: 3px;         

    }


    .c
    {
        text-decoration-line: line-through;
        text-decoration-style:double ;
        text-decoration-color:rgb(245, 207, 125) ;
        text-decoration-thickness: 3px;         
    }


    .d
    {
        text-decoration-line: line-through;
        text-decoration-style:wavy ;
        text-decoration-color:rgb(189, 161, 211);
        text-decoration-thickness: 5px;        
    }


</style>
<body>
<h3 class="a">今天天氣真好!!</h3>
<br>
<h3 class="b">今天天氣真好!!</h3>
<br>
<h3 class="c">今天天氣真好!!</h3>
<br>
<h3 class="d">今天天氣真好!!</h3>
<br>
</body>
</html>
